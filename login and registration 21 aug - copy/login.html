<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="../img/TCH-VERBENA LOGO.webp" rel="icon">
    <title>Login to Verbena</title>

    <link rel="stylesheet" href="./css/login.css">
    <!-- Fontawesome CDN Link -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <script src="https://kit.fontawesome.com/a81368914c.js"></script>
    <link rel="stylesheet" href="https://unicons.iconscout.com/release/v4.0.0/css/line.css">
</head>
<body>
    <div class="wave">
        <h1>Hello Again <br> Welcome Back</h1>
        <img class="bgimg" src="./img/1img.png" alt="">
    </div>
    <div class="container">
        <div class="login-container">
            <div class="navbtn">
                <!-- <a href="./signup.html"><button class="navsignup">SignUp</button></a>
                <a href="./login.html"><button class="navlogin">Login</button></a> -->
            </div>
            <form action="index.html">
                    <h2>Login</h2>
                    <div class="input-div one">
                        <div  class="i">
                            <i class="fas fa-user"></i>
                        </div>
                        <div>
                            <h5>Email</h5>
                            <input class="input" type="email" required>
                        </div>
                    </div>

                    <div class="input-div two">
                        <div class="i">
                            <i class="fas fa-lock"></i>
                        </div>
                        <div>
                            <h5>Password</h5>
                            <input class="input" id="password" type="password" required>
                            <span><i class="uil uil-eye-slash showHidePw"></i></span>
                        </div>
                    </div>
                    <a href="#" class="forgot-password">Forgot Password?</a>
                    <input type="submit" class="btn" value="Login">

                    <div class="login-signup">
                        <span class="text">Not a member?
                            <a href="./signup.html" class="text signup-text">Signup</a>
                        </span>
                    </div>
                
                </form>
                
                

            </div>
        </div>
        </div>
        <div id="preloader"></div>
    </div>  
    <script type="text/javascript" src="js/main.js"></script>
    <!-- <script type="text/javascript" src="js/login.js"></script> -->
    <script src="../home/assets/js/main.js"></script>

</body>
</html>
