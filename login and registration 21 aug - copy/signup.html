<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="../img/TCH-VERBENA LOGO.webp" rel="icon">
    <title>Verbena Registration</title>
    <link rel="stylesheet" href="./css/signup.css">
    <!-- Fontawesome CDN Link -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <script src="https://kit.fontawesome.com/a81368914c.js"></script>
    <link rel="stylesheet" href="https://unicons.iconscout.com/release/v4.0.0/css/line.css">
</head>
<body>
    <div class="wave">
        <h1>Welcome to <br> Verbena Committee</h1>
        <img class="bgimg" src="./img/1img.png" alt="">
    </div>
        <div class="container">  
            <div class="login-container">
                <!-- <div class="navbtn">
                    <a href="./signup.html"><button class="navsignup">SignUp</button></a>
                    <a href="./login.html"><button class="navlogin">Login</button></a>
                </div> -->
                <form action="index.html">
                    
                        <h2>SignUp</h2>
                        <div class="input-div one">
                            <div  class="i">
                                <i class="fas fa-user"></i>
                            </div>
                            <div>
                                <h5>Full Name</h5>
                                <input class="input" type="text" required>
                            </div>
                        </div>

                        <div class="input-div one">
                            <div  class="i">
                                <i class="uil uil-envelope"></i>
                            </div>
                            <div>
                                <h5>Email</h5>
                                <input class="input" type="email" required>
                            </div>
                        </div>

                        <div class="input-div one">
                            <div  class="i">
                                <i class="uil uil-book-alt"></i>
                            </div>
                            <div>
                                <h5>College Roll</h5>
                                <input class="input" type="number" required>
                            </div>
                        </div>

                        <div class="input-div one">
                            <div  class="i">
                                <i class="uil uil-book-open"></i>
                            </div>
                            <div class="radio">
                                
                                <input type="radio" id="BCA" name="dept" value="BCA" required>
                                <label for="BCA">BCA</label>
                                <input type="radio" id="BBA" name="dept" value="BBA" required>
                                <label for="BBA">BBA</label>
                                <input type="radio" id="MCA" name="dept" value="MCA" required>
                                <label for="MCA">MCA</label>
                                <input type="radio" id="MSC" name="dept" value="MSC" required>
                                <label for="MSC">MSC</label>
                            </div>
                        </div>


                        <div class="input-div two">
                            <div class="i">
                                <i class="fas fa-lock"></i>
                            </div>
                            <div>
                                <h5>Password</h5>
                                <input class="input" id="password" type="password" required>
                                <span><i class="uil uil-eye-slash showHidePw"></i></span>
                            </div>
                        </div>

                        <div class="input-div two">
                            <div class="i">
                                <i class="fas fa-lock"></i>
                            </div>
                            <div>
                                <h5>Confirm Password</h5>
                                <input class="input" id="password" type="password" required>
                                <span><i class="uil uil-eye-slash showHidePw"></i></span>
                            </div>
                        </div>
                        <!-- <a href="#" class="forgot-password">Forgot Password?</a> -->
                        <input type="submit" class="btn" value="Signup">

                        <div class="login-signup">
                            <span class="text">Already a member?
                                <a href="./login.html" class="text signup-text">Login</a>
                            </span>
                        </div>
                    
                    </form>
                    
                </div>

            </div>
            <div id="preloader"></div>
    
    </div>
    <script type="text/javascript" src="js/main.js"></script>
    <!-- <script type="text/javascript" src="js/login.js"></script> -->
    <script src="../home/assets/js/main.js"></script>
</body>
</html>
